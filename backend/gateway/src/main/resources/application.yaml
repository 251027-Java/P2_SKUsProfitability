server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: authservice-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: productservice-skus-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/skus/**

        - id: productservice-lists-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/lists/**

        - id: calculatorservice-route
          uri: lb://CALCULATOR-SERVICE
          predicates:
            - Path=/api/calculator/**

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.spring: DEBUG
