spring.application.name=ProductService
server.port=8082

# Database Configuration (same PostgreSQL as main backend)
spring.datasource.url=jdbc:postgresql://localhost:5432/product_db
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword

jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!!

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration (allow main backend and frontend to call this service)
spring.web.cors.allowed-origins=http://localhost:8080,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always