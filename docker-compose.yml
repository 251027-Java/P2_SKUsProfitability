services:
  db:
    image: postgres:16-alpine
    container_name: sku-profitability-db
    environment:
      POSTGRES_DB: sku_profitability_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sku_profitability_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - sku-network

  # CalculatorService Microservice - handles fee calculations and stores calculation history
  calculator-service:
    build:
      context: ./backend/CalculatorService
      dockerfile: Dockerfile
    container_name: sku-calculator-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sku_profitability_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sku-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/calculator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AuthService Microservice - handles authentication and user management
  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile
    container_name: sku-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sku_profitability_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
      JWT_SECRET: QzXgN8yJpY4rL2sF5vW0hT1bA7eC9uD3kH6mZpXqYwS0jL9kVyN8tR7eF6dG5hA9bC8dE7fG6hI5jK4lM3nO2pQ1rS0tU9vW8xY7zZ6yA5bX4cW3vU2tS1rQ0pOnM9lK8jI7hG6fE5dC4bA3zY2xW1vU0tS9rQ8pOn
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sku-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/api/auth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Main Backend Service - delegates calculator operations to calculator-service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sku-profitability-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sku_profitability_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
      JWT_SECRET: QzXgN8yJpY4rL2sF5vW0hT1bA7eC9uD3kH6mZpXqYwS0jL9kVyN8tR7eF6dG5hA9bC8dE7fG6hI5jK4lM3nO2pQ1rS0tU9vW8xY7zZ6yA5bX4cW3vU2tS1rQ0pOnM9lK8jI7hG6fE5dC4bA3zY2xW1vU0tS9rQ8pOn
      SPRING_PROFILES_ACTIVE: docker
      # Inter-service communication - points to calculator-service and auth-service
      CALCULATOR_SERVICE_URL: http://calculator-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      calculator-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sku-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  sku-network:
    driver: bridge

